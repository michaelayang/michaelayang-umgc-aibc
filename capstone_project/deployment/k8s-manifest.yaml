apiVersion: apps/v1
kind: Deployment
metadata:
  name:  python-myang-mathbot-deployment
  labels:
    app: python-myang-mathbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-myang-mathbot
  template:
    metadata:
      labels:
        app: python-myang-mathbot
    spec:
      containers:
      - name: python-myang-mathbot-container
        image: local-myang-mathbot-python:v1
        imagePullPolicy: Never # Forces K8s to look locally
        ports:
        - containerPort: 5000
        env:
        - name:  OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-key-secret
              key:  OPENAI_API_KEY
        - name:  GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-key-secret
              key:  GEMINI_API_KEY
        - name:  APP_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-key-secret
              key:  APP_SECRET_KEY
        - name:  NGROK_AUTHTOKEN
          valueFrom:
            secretKeyRef:
              name: app-key-secret
              key:  NGROK_AUTHTOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: python-myang-mathbot-service
spec:
  type: NodePort
  selector:
    app: python-myang-mathbot
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30180

